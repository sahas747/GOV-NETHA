<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ගොවි නෙත | අස්වනු නෙලීම</title><script>document.documentElement.dataset.theme=localStorage.getItem("goviTheme")||"light";</script><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div id="siteHeader"></div><main><div class="container page-head"><span class="badge">📍 Map Service</span><h1 id="pageTitle">අස්වනු නෙලීම</h1><p id="pageDesc">අස්වනු නෙලීමේ යන්ත්‍ර සහ සේවා map එකෙන් සොයන්න.</p></div><div class="container map-wrap"><aside class="filters"><h3>🔎 සොයන්න</h3><div class="field"><label>නම / ප්‍රදේශය</label><input id="serviceSearch" placeholder="උදා: අම්පාර"><button type="button" class="btn primary" id="serviceSearchBtn">🔎 සොයන්න</button></div><div class="field"><label>ප්‍රදේශය</label><select id="areaFilter"><option value="">සියලු ප්‍රදේශ</option><option>අම්පාර</option><option>කල්මුණේ</option><option>මහඔය</option><option>මොනරාගල</option></select></div><button type="button" class="btn primary" id="serviceMyLocationBtn" style="width:100%;margin-top:12px">📍 මගේ ස්ථානය</button><div class="card" style="padding:14px;margin-top:15px"><b>📌 භාවිතා කරන ආකාරය</b><p style="font-size:12px;color:#9db3a6;line-height:1.7">ඔබේ ප්‍රදේශය තෝරන්න. Map එකේ පෙන්වන marker එකක් click කර service details බලන්න. අවශ්‍ය නම් Booking කරන්න.</p></div></aside><section><div id="map" class="map"></div><div id="results" class="results"></div></section></div></main><div class="modal" id="bookingModal"><div class="modal-box"><button class="close" data-close="bookingModal">✕</button><h2>Booking Request</h2><form id="bookingForm"><input type="hidden" id="bookingId"><div class="field"><label>සේවාව</label><input id="bookingGig" readonly></div><div class="field"><label>දිනය</label><input id="bookDate" type="date" required></div><div class="field"><label>ඔබගේ ප්‍රදේශය</label><input id="bookArea" required placeholder="අම්පාර"></div><button class="btn primary" style="width:100%">Booking යවන්න</button></form></div></div><div id="toast" class="toast"></div><script src="../js/header.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="../js/app.js"></script><script type="module">import {setupServicePage} from "../js/services.js";import "../js/firebase-config.js";setupServicePage("harvesting");</script></body></html>
